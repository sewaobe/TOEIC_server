version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: toeic-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  toeic-server:
    image: sewaobe/toeic-server:latest
    container_name: toeic-server
    restart: always
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # GHI ĐÈ đè biến từ .env để chắc chắn dùng Mongo trong Docker
      MONGO_URI: mongodb://mongo:27017/toeic-db

volumes:
  mongo_data:
