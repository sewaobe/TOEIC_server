name: Build & Deploy Server

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toeic-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/toeic-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            cd /root/app

            echo "Pull latest image"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/toeic-server:latest

            echo "Detect active backend"

            ACTIVE=$(grep -o '127.0.0.1:500[12]' /etc/nginx/sites-available/toeic-api)

            echo "Active backend: $ACTIVE"

            if [[ "$ACTIVE" == "127.0.0.1:5001" ]]; then
                NEW_COLOR="green"
                NEW_PORT="5002"
                OLD_COLOR="blue"
                OLD_PORT="5001"
            else
                NEW_COLOR="blue"
                NEW_PORT="5001"
                OLD_COLOR="green"
                OLD_PORT="5002"
            fi

            echo "Deploy new backend: $NEW_COLOR on port $NEW_PORT"

            docker compose up -d backend_$NEW_COLOR

            echo "Health check..."
            HEALTHY=false
            for i in {1..10}; do
                if curl -fs http://127.0.0.1:$NEW_PORT/api/healthy; then
                    echo "Health check OK"
                    HEALTHY=true
                    break
                fi
                echo "Waiting service..."
                sleep 3
            done

            # Cơ chế bảo vệ nếu service mới không healthy thì sẽ không chuyển nginx upstream
            if [ "$HEALTHY" = false ]; then
                echo "New service is not healthy. Aborting deployment."
                docker compose stop backend_$NEW_COLOR
                exit 1
            fi

            echo "Switch nginx upstream"

            sed -i "s/127.0.0.1:$OLD_PORT/127.0.0.1:$NEW_PORT/g" /etc/nginx/sites-available/toeic-api

            nginx -s reload

            echo "Stop old backend"

            docker compose stop backend_$OLD_COLOR

            docker image prune -f
